name: Validate and deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'scripts/package_backend.py'
      - 'requirements*.txt'
      - 'startup.sh'
      - 'pytest.ini'
      - '.python-version'
      - 'compose.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrelinhas-sql-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://entrelinhas:entrelinhas-local@127.0.0.1:5433/entrelinhas
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test domain, persistence, concurrency and API
        run: python -m pytest -q -m 'not interface'
      - name: Validate OpenAPI
        run: python -m openapi_spec_validator server/openapi.yaml
      - name: Package backend
        run: python scripts/package_backend.py --output dist/backend-azure.zip
      - uses: actions/upload-artifact@v4
        with:
          name: backend-azure
          path: dist/backend-azure.zip
          retention-days: 7
      - name: Stop test database
        if: always()
        run: docker compose down

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend-azure.zip
          startup-command: bash startup.sh
      - name: Verify public API and database
        env:
          API_URL: ${{ vars.AZURE_API_BASE_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            --retry-all-errors --max-time 30 "${API_URL%/}/api/health" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}'
