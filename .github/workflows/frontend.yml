name: Validate and deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'tests/**'
      - 'scripts/package_frontend.py'
      - 'requirements*.txt'
      - 'compose.yml'
      - '.github/workflows/frontend.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrelinhas-sql-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://entrelinhas:entrelinhas-local@127.0.0.1:5433/entrelinhas
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Validate browser flows and packages
        run: |
          python -m pytest -q -m interface
          python -m pytest tests/test_pacote_frontend.py -q
          node --check client/config.js
          node --check client/js/api.js
          node --check client/js/app.js
      - name: Stop test database
        if: always()
        run: docker compose down

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare public assets
        env:
          API_URL: ${{ vars.AZURE_API_BASE_URL }}
        run: python scripts/package_frontend.py --api-url "$API_URL"
      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/client
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
